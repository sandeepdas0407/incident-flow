[project]
name = "incident-flow-agent"
version = "0.1.0"
description = "AI agents that pick up ServiceNow tickets and remediate them via GitHub PRs (app code + Terraform on Azure)."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlmodel>=0.0.22",
  "anthropic>=0.75",
  "PyGithub>=2.5",
  "pyyaml>=6.0.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
